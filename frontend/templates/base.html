<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kế hoạch Sản xuất{% endblock %}</title>
    <meta name="description" content="Hệ thống quản lý kế hoạch sản xuất B7KHSX">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- App CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260516">
    
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <img src="{{ url_for('project_images', filename='logo.png') }}" alt="Logo" class="sidebar-logo" onerror="this.style.display='none'">
            <h3 id="project-name" class="sidebar-title">Kế hoạch Sản xuất</h3>
        </div>
        
        <div class="sidebar-menu" id="sidebar-menu">
            <!-- Menu được load bằng JS -->
            <div class="menu-loading"><i class="bi bi-arrow-repeat spin"></i> Đang tải menu...</div>
        </div>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span>
                    <strong>{{ fullname }}</strong>
                    <small>({{ username }})</small>
                </span>
            </div>
            <button class="btn-logout" onclick="doLogout()">
                <i class="bi bi-box-arrow-left"></i> Đăng xuất
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
        <!-- Top bar -->
        <header class="topbar">
            <button class="btn-toggle-sidebar" onclick="toggleSidebar()">
                <i class="bi bi-list"></i>
            </button>
            <div id="breadcrumb" class="breadcrumb-nav">
                <span id="current-page-title">Trang chủ</span>
            </div>
        </header>
        
        <!-- Page content -->
        <div id="page-content" class="page-content">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast-container" class="toast-container"></div>

    <!-- App JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}?v=20260516"></script>
    {% block scripts %}{% endblock %}
    
    <script>
        // Load menu on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadSidebarMenu();
        });
    </script>
</body>
</html>
